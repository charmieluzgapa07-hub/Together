<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violet Background Live Text Slide Banner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Nilagyan ng violet/dark purple ang background ng buong page */
            background-color: #1a0b2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        /* Banner Container na may violet gradient at subtle border */
        .banner-container {
            width: 100%;
            max-width: 900px;
            height: 60px;
            background: linear-gradient(135deg, rgba(45, 15, 78, 0.9) 0%, rgba(75, 25, 120, 0.9) 100%);
            border: 2px solid rgba(147, 51, 234, 0.5);
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(75, 25, 120, 0.5);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Continuous Sliding Track */
        .slide-track {
            display: flex;
            align-items: center;
            white-space: nowrap;
            width: max-content;
            animation: continuousSlide 18s linear infinite;
        }

        /* Continuous Slide Keyframes */
        @keyframes continuousSlide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* Pause slide kapag hinawakan o ini-edit */
        .banner-container:hover .slide-track,
        .slide-track:focus-within {
            animation-play-state: paused;
        }

        /* Live Text Styles */
        .slide-group {
            display: flex;
            align-items: center;
        }

        .text-item {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
            padding: 0 10px;
            outline: none;
            cursor: text;
        }

        .text-item.highlight {
            color: #d8b4fe; /* Banayad na violet/lavender highlight para sa Connect With Us */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Icon Image Styling */
        .banner-icon {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 12px;
            vertical-align: middle;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .separator {
            color: #d8b4fe;
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 0.8;
            margin: 0 15px;
        }
    </style>
</head>
<body>

    <!-- Violet Theme Live Text Banner -->
    <div class="banner-container">
        <div class="slide-track">
            <!-- Unang pangkat ng Live Text at Local Images -->
            <div class="slide-group">
                <span class="text-item highlight" contenteditable="true">CONNECT WITH US</span>
                <img src="./logo1.png" alt="Icon 1" class="banner-icon">
                <span class="text-item" contenteditable="true">TOGETHER Church Skyline - UPC</span>
                <img src="./logo2.png" alt="Icon 2" class="banner-icon">
                <span class="text-item" contenteditable="true">TOGETHER Worship</span>
                <span class="separator">•</span>
            </div>

            <!-- Pangalawang pangkat para sa tuluy-tuloy na seamless loop -->
            <div class="slide-group">
                <span class="text-item highlight" contenteditable="true">CONNECT WITH US</span>
                <img src="./logo1.png" alt="Icon 1" class="banner-icon">
                <span class="text-item" contenteditable="true">TOGETHER Church Skyline - UPC</span>
                <img src="./logo2.png" alt="Icon 2" class="banner-icon">
                <span class="text-item" contenteditable="true">TOGETHER Worship</span>
                <span class="separator">•</span>
            </div>
        </div>
    </div>

</body>
</html>
